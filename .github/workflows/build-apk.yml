name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile SnapBox Downloader APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List Generated APKs
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload Lightweight Phone APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: SnapBox-arm64-v8a-Lightweight-APK
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Universal All-Devices APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapBox-Universal-APK
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          retention-days: 30
          if-no-files-found: ignore